{# Cabeçalho das telas de gerenciamento: título, texto e botão "novo" #}
<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <p class="text-xs font-black uppercase tracking-widest text-primary">Painel do administrador</p>
    <h1 class="text-balance text-3xl font-black tracking-tight md:text-4xl">{{ titulo }}</h1>
    <p class="mt-1 text-pretty font-semibold leading-relaxed text-muted-foreground">{{ texto }}</p>
  </div>
  <a href="{{ url_novo }}"
     class="inline-flex items-center justify-center gap-2 rounded-2xl px-5 py-3 text-sm font-black uppercase tracking-wide transition-colors bg-primary text-primary-foreground btn-3d hover:brightness-105">
    <i data-lucide="plus" class="size-4" aria-hidden="true"></i> {{ rotulo_novo }}
  </a>
</div>
