<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="entrar.css">
</head>
<body>
    <form action="Processo" method="post">
        <h1>Entrar na Conta</h1>

        <div class="grupo-campo">
            <label for="nome">Nome do Aluno:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="grupo-campo">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="grupo-campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="grupo-campo">
            <label for="id">Código do Aluno:</label>
            <input type="text" id="id" name="id" required>
        </div>

        <div class="grupo-campo">
            <label for="cod">Código do Professor:</label>
            <input type="text" id="cod" name="cod" required>
        </div>

        <div class="butões">
            <input type="submit" id="sub" value="Entrar">
            <input type="reset" id="res" value="Limpar">
        </div>
    </form>
</body>
</html>
