<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Estudaí</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <form id="formCadastro" action="entrar.html" method="get">
        <h1>Criar Minha Conta</h1>

        <div class="grupo-campo">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>
        </div>

        <div class="grupo-campo">
            <label for="escola">Escola do Aluno:</label>
            <input type="text" id="escola" name="escola" placeholder="Ex: Escola Estadual Machado de Assis" required>
        </div>

        <div class="grupo-campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="grupo-campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
        </div>

        <!-- Aviso explicativo sobre o Código de Acesso -->
        <p style="font-size: 13px; color: #A14206; text-align: center; margin-top: 6px;">
            ℹ️ Seu <strong>Código do Aluno</strong> será gerado automaticamente ao concluir seu cadastro.
        </p>

        <div class="butões">
            <input type="submit" id="sub" value="Criar Conta">
            <input type="reset" id="res" value="Limpar">
        </div>
    </form>

    <!-- Script de Simulação de Cadastro e Redirecionamento -->
    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita a atualização imediata da página

            // Gera um código de aluno fictício para teste (Ex: EST-4921)
            const codigoAlunoGerado = "EST-" + Math.floor(1000 + Math.random() * 9000);

            // Exibe o alerta com a mensagem de sucesso e o código do aluno
            alert("Cadastro realizado com sucesso!\n\nSeu Código do Aluno é: " + codigoAlunoGerado + "\nUse este código para acessar a plataforma junto com o código do seu professor.");

            // Redireciona o usuário para a página entrar.html
            window.location.href = "entrar.html";
        });
    </script>
</body>
</html>
